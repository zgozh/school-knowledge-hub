[project]
name = "school-knowledge-hub"
version = "0.1.0"
description = "面向校务管理的AI自动数据采集与知识管理中台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pymilvus>=2.4.0",
    "motor>=3.5",
    "minio>=7.2",
    "httpx>=0.27",
    "selectolax>=0.3",
    "trafilatura>=2.0",
    "apscheduler>=3.10",
    "openai>=1.40",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "FlagEmbedding>=1.2.10",
    "simhash>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: 需要 docker 存储与 model_server 在线的集成测试"]
